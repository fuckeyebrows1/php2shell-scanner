; Settings for the patched PHP container CI scans.
;
; expose_php is forced on so the target advertises its release even if the
; image's php.ini stops doing so; the scanner needs that to reach a version
; verdict. memory_limit stays at PHP's default 128M, which is outside the 2M-32M
; range where the README documents a false positive on patched 8.4.27.
expose_php = On
memory_limit = 128M
