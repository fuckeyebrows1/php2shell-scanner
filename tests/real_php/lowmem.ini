; Settings for the low-memory patched container CI scans.
;
; memory_limit sits inside the 2M-32M band where the README records the false
; positive on 8.4.27, display_errors is off so the exhaustion shows up as the
; ambiguous empty HTTP 500, and max_multipart_body_parts is raised past the
; probe's 4000 parts so PHP parses the body far enough to run out of memory
; instead of rejecting it.
expose_php = On
memory_limit = 8M
display_errors = Off
max_multipart_body_parts = 6000
