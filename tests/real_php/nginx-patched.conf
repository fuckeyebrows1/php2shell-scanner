# Front for the patched PHP-FPM control in the real-PHP CI job.
#
# Same as nginx.conf, except that the upstream is the patched pool: the two FPM
# containers are separate, so each needs its own fastcgi_pass. Keeping them in
# separate nginx containers also keeps their 502s and logs apart, which is what
# makes a dead worker visible on the target that should not have one.
#
# client_max_body_size is lifted because the probes are 1 to 20 MiB: nginx's
# 1 MiB default would answer 413 and PHP would never parse the body at all.
server {
    listen 80;
    server_name _;
    client_max_body_size 0;
    fastcgi_read_timeout 300s;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_pass php-fpm-patched:9000;
    }
}
