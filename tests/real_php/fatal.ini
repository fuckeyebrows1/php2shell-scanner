; Settings for the patched container whose memory exhaustion is reported in-band.
;
; Same build and memory_limit as lowmem.ini, but display_errors is on, so the
; patched build renders the memory-exhaustion fatal error in the response body
; instead of an empty HTTP 500. That is the same signal the vulnerable parser
; produces, so the advertised release still has to decide the verdict.
expose_php = On
memory_limit = 8M
display_errors = On
display_startup_errors = On
max_multipart_body_parts = 6000
