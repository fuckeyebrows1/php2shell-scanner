; Settings for the unpatched container the scanner must still report vulnerable.
;
; expose_php is on so the advertised release corroborates the verdict, but the
; check also requires probe crash evidence, because the version rule alone would
; pass without the parser ever being exercised. memory_limit stays at PHP's
; default 128M, so ordinary memory-limit exhaustion cannot explain a crash.
expose_php = On
memory_limit = 128M
