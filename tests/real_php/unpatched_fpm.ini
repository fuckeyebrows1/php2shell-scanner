; Settings for the unpatched PHP-FPM container the worker-death rule is proven on.
;
; expose_php is off on purpose. The scanner settles memory exhaustion by the
; advertised release, so with no X-Powered-By header that rule cannot fire and a
; VULNERABLE verdict can only come from a worker that disappeared mid-request.
;
; memory_limit is raised well past the 128M that stops the parser on the mod_php
; target, so ordinary exhaustion does not end the request before the parser
; corrupts memory, and display_errors is off so a fatal error cannot arrive
; in-band where the scanner would classify it as exhaustion.
expose_php = Off
memory_limit = 1G
display_errors = Off
max_multipart_body_parts = 6000
