; Settings for the unpatched PHP-FPM container the worker-death rule is proven on.
;
; expose_php is off on purpose. The scanner settles memory exhaustion by the
; advertised release, so with no X-Powered-By header that rule cannot fire and a
; VULNERABLE verdict can only come from a worker that disappeared mid-request.
;
; memory_limit is disabled because PHP catches the limit as a fatal error and
; keeps the worker alive: on the mod_php target at 128M the same probe reports
; "Allowed memory size ... exhausted" in-band and the handler survives. With no
; limit, the probe's memory amplification is stopped by the container's memory
; cap instead, which kills the worker rather than raising a fatal, and that is
; the death nginx reports as 502. display_errors is off so a catchable fatal
; could not arrive in-band either.
expose_php = Off
memory_limit = -1
display_errors = Off
max_multipart_body_parts = 6000
