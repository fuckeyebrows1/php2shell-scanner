; Settings for the patched PHP-FPM control in the real-PHP CI job.
;
; This is unpatched_fpm.ini pointed at a fixed build: expose_php is on so the
; advertised release can decide the verdict, memory_limit is disabled for the
; same reason, and display_errors is off so no fatal can arrive in-band. The
; container runs with the same 160m cap, so both targets see the probe under
; the same budget and only the build differs.
;
; The probe's allocations run into the 160m cap, so this worker is killed just
; like the unpatched one. The advertised release is what has to keep the verdict
; at FIXED: worker death is not proof once memory_limit is disabled, because a
; container cap can end a patched worker too.
expose_php = On
memory_limit = -1
display_errors = Off
max_multipart_body_parts = 6000
