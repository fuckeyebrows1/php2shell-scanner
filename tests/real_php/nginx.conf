# Front for the unpatched PHP-FPM target in the real-PHP CI job.
#
# The FastCGI upstream is the PHP-FPM container on the job's docker network, so
# nginx answers 502 when the worker handling a probe dies mid-request. That
# response is the signal the mod_php target cannot produce, because there the
# request handler and the worker are the same process.
#
# client_max_body_size is lifted because the probes are 1 to 20 MiB: nginx's
# 1 MiB default would answer 413 and PHP would never parse the body at all.
server {
    listen 80;
    server_name _;
    client_max_body_size 0;
    fastcgi_read_timeout 300s;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_pass php-fpm-unpatched:9000;
    }
}
