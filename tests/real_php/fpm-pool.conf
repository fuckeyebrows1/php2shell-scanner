; Pool settings for both PHP-FPM CI targets, patched and unpatched.
;
; Loaded after the image's www.conf, so these override it. Two workers keep the
; idle footprint small enough that the container's memory cap is spent on the
; probe and not on a pool of sleeping children, and they leave a sibling for the
; master to keep serving with after the unpatched probe's worker is killed.
; Both targets share this file so the two runs are compared under one pool
; shape and only the PHP build differs.
[www]
pm = static
pm.max_children = 2
