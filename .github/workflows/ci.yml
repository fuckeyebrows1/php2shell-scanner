name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Verdict smoke tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Declared floor. setup-python ships no 3.9 build for Ubuntu 26.04
          # (what ubuntu-latest now resolves to), so pin an image that has one.
          - python-version: "3.9"
            os: ubuntu-24.04
          # Matches the interpreter in the Docker image.
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run verdict smoke tests
        run: python tests/smoke_test.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t php2shell-scanner .

      - name: Check entrypoint
        run: docker run --rm php2shell-scanner --help

      - name: Scan a local mock target from inside the image
        run: |
          set -euo pipefail
          # An unpatched release is advertised so the mock's in-band OOM fatal
          # is corroborated by the version instead of being ambiguous.
          python3 tests/mock_server.py 18080 vuln 8.4.26 &
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/; then
              break
            fi
            sleep 0.2
          done
          if ! curl -fsS -o /dev/null http://127.0.0.1:18080/; then
            echo "mock target never became ready"
            exit 1
          fi

          set +e
          docker run --rm --network host php2shell-scanner \
            -u http://127.0.0.1:18080 -q --no-color
          status=$?
          set -e

          if [ "$status" -ne 1 ]; then
            echo "expected exit code 1 for a vulnerable target, got $status"
            exit 1
          fi
          echo "image correctly flagged the vulnerable mock target"

  # The mock target cannot reproduce a real PHP build, so the README's
  # documented memory_limit false positive is only observable against an
  # actual patched server: this job scans one and requires a clean verdict.
  real-php:
    name: Real PHP target checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # The release the fixed-version table calls unpatched, at PHP's default
      # memory_limit. --expect-vulnerable asserts the verdict comes from a probe
      # crashing the request handler, not from the advertised version alone, so
      # this proves the probe rules on a build that actually has the bug. It runs
      # first: missed detections matter more than an over-eager verdict.
      - name: Start unpatched PHP 8.4.26
        run: |
          docker run --detach --name php-unpatched --publish 18093:80 \
            --volume "$PWD/tests/real_php/index.php:/var/www/html/index.php:ro" \
            --volume "$PWD/tests/real_php/unpatched.ini:/usr/local/etc/php/conf.d/zz-ci.ini:ro" \
            php:8.4.26-apache

          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18093/index.php; then
              exit 0
            fi
            sleep 1
          done
          echo "unpatched PHP target never became ready"
          docker logs php-unpatched
          exit 1

      - name: Scan the unpatched target
        run: >-
          python tests/real_php_check.py http://127.0.0.1:18093/index.php
          --expect-vulnerable

      # PHP-FPM keeps the workers in a separate process from the web server, so
      # an unpatched build that loses a worker mid-probe makes nginx answer 502.
      # mod_php cannot show this: there the worker is the request handler, which
      # is why the step above only ever proved the in-band exhaustion path. The
      # target hides its release, so the version rule cannot decide the verdict
      # and VULNERABLE can only come from the dead worker.
      - name: Start unpatched PHP-FPM 8.4.26 behind nginx
        run: |
          set -euo pipefail
          docker network create php2shell-ci

          docker run --detach --name php-fpm-unpatched --network php2shell-ci \
            --volume "$PWD/tests/real_php/index.php:/var/www/html/index.php:ro" \
            --volume "$PWD/tests/real_php/unpatched_fpm.ini:/usr/local/etc/php/conf.d/zz-ci.ini:ro" \
            php:8.4.26-fpm

          docker run --detach --name nginx-unpatched --network php2shell-ci \
            --publish 18094:80 \
            --volume "$PWD/tests/real_php/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine

          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18094/index.php; then
              exit 0
            fi
            sleep 1
          done
          echo "unpatched PHP-FPM target never became ready"
          docker logs php-fpm-unpatched
          docker logs nginx-unpatched
          exit 1

      - name: Scan the unpatched PHP-FPM target
        run: >-
          python tests/real_php_check.py http://127.0.0.1:18094/index.php
          --expect-worker-death

      # Pinned to the release the README names as patched, and mounted with an
      # explicit ini so expose_php and memory_limit do not depend on the image.
      - name: Start patched PHP 8.4.27
        run: |
          docker run --detach --name php-patched --publish 18090:80 \
            --volume "$PWD/tests/real_php/index.php:/var/www/html/index.php:ro" \
            --volume "$PWD/tests/real_php/ci.ini:/usr/local/etc/php/conf.d/zz-ci.ini:ro" \
            php:8.4.27-apache

          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18090/index.php; then
              exit 0
            fi
            sleep 1
          done
          echo "PHP target never became ready"
          docker logs php-patched
          exit 1

      - name: Scan the patched target
        run: python tests/real_php_check.py http://127.0.0.1:18090/index.php --body php2shell-ci

      # The same build at a memory_limit the README names as a false positive.
      # The probe now exhausts memory and comes back as an empty HTTP 500, which
      # must not be reported as vulnerable while the release stays patched.
      - name: Start patched PHP 8.4.27 with a small memory_limit
        run: |
          docker run --detach --name php-lowmem --publish 18091:80 \
            --volume "$PWD/tests/real_php/index.php:/var/www/html/index.php:ro" \
            --volume "$PWD/tests/real_php/lowmem.ini:/usr/local/etc/php/conf.d/zz-ci.ini:ro" \
            php:8.4.27-apache

          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18091/index.php; then
              exit 0
            fi
            sleep 1
          done
          echo "low-memory PHP target never became ready"
          docker logs php-lowmem
          exit 1

      # The probe response here is the empty 500 by design, so no --body marker:
      # the overridden signal is what proves a real PHP answered the probe.
      - name: Scan the low-memory target
        run: >-
          python tests/real_php_check.py http://127.0.0.1:18091/index.php
          --expect-signal

      # The same build at the same memory_limit, but reporting errors in-band: the
      # patched build now serves the memory-exhaustion fatal the vulnerable parser
      # also produces, so the advertised release still has to decide the verdict.
      - name: Start patched PHP 8.4.27 with in-band error reporting
        run: |
          docker run --detach --name php-fatal --publish 18092:80 \
            --volume "$PWD/tests/real_php/index.php:/var/www/html/index.php:ro" \
            --volume "$PWD/tests/real_php/fatal.ini:/usr/local/etc/php/conf.d/zz-ci.ini:ro" \
            php:8.4.27-apache

          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18092/index.php; then
              exit 0
            fi
            sleep 1
          done
          echo "in-band PHP target never became ready"
          docker logs php-fatal
          exit 1

      - name: Scan the in-band target
        run: >-
          python tests/real_php_check.py http://127.0.0.1:18092/index.php
          --expect-fatal

      - name: Show container logs
        if: failure()
        run: |
          docker logs php-patched || true
          docker logs php-lowmem || true
          docker logs php-fatal || true
          docker logs php-unpatched || true
          docker logs nginx-unpatched || true
          docker logs php-fpm-unpatched || true
          echo "--- unpatched worker exits ---"
          docker logs php-unpatched 2>&1 \
            | grep -iE 'segmentation|child pid|signal|memory' | tail -20 || true
          echo "--- unpatched PHP-FPM worker exits ---"
          docker logs php-fpm-unpatched 2>&1 \
            | grep -iE 'segmentation|exited on signal|child pid|memory' | tail -20 \
            || true

      - name: Stop the containers
        if: always()
        run: |
          docker rm --force php-patched || true
          docker rm --force php-lowmem || true
          docker rm --force php-fatal || true
          docker rm --force php-unpatched || true
          docker rm --force nginx-unpatched || true
          docker rm --force php-fpm-unpatched || true
          docker network rm php2shell-ci || true
