name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Verdict smoke tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Declared floor. setup-python ships no 3.9 build for Ubuntu 26.04
          # (what ubuntu-latest now resolves to), so pin an image that has one.
          - python-version: "3.9"
            os: ubuntu-24.04
          # Matches the interpreter in the Docker image.
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run verdict smoke tests
        run: python tests/smoke_test.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t php2shell-scanner .

      - name: Check entrypoint
        run: docker run --rm php2shell-scanner --help

      - name: Scan a local mock target from inside the image
        run: |
          set -euo pipefail
          python3 tests/mock_server.py 18080 vuln &
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/; then
              break
            fi
            sleep 0.2
          done
          if ! curl -fsS -o /dev/null http://127.0.0.1:18080/; then
            echo "mock target never became ready"
            exit 1
          fi

          set +e
          docker run --rm --network host php2shell-scanner \
            -u http://127.0.0.1:18080 -q --no-color
          status=$?
          set -e

          if [ "$status" -ne 1 ]; then
            echo "expected exit code 1 for a vulnerable target, got $status"
            exit 1
          fi
          echo "image correctly flagged the vulnerable mock target"

  # The mock target cannot reproduce a real PHP build, so the README's
  # documented memory_limit false positive is only observable against an
  # actual patched server: this job scans one and requires a clean verdict.
  real-php:
    name: Patched PHP false-positive check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Pinned to the release the README names as patched, and mounted with an
      # explicit ini so expose_php and memory_limit do not depend on the image.
      - name: Start patched PHP 8.4.27
        run: |
          docker run --detach --name php-patched --publish 18090:80 \
            --volume "$PWD/tests/real_php/index.php:/var/www/html/index.php:ro" \
            --volume "$PWD/tests/real_php/ci.ini:/usr/local/etc/php/conf.d/zz-ci.ini:ro" \
            php:8.4.27-apache

          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18090/index.php; then
              exit 0
            fi
            sleep 1
          done
          echo "PHP target never became ready"
          docker logs php-patched
          exit 1

      - name: Scan the patched target
        run: python tests/real_php_check.py http://127.0.0.1:18090/index.php --body php2shell-ci

      # The same build at a memory_limit the README names as a false positive.
      # The probe now exhausts memory and comes back as an empty HTTP 500, which
      # must not be reported as vulnerable while the release stays patched.
      - name: Start patched PHP 8.4.27 with a small memory_limit
        run: |
          docker run --detach --name php-lowmem --publish 18091:80 \
            --volume "$PWD/tests/real_php/index.php:/var/www/html/index.php:ro" \
            --volume "$PWD/tests/real_php/lowmem.ini:/usr/local/etc/php/conf.d/zz-ci.ini:ro" \
            php:8.4.27-apache

          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18091/index.php; then
              exit 0
            fi
            sleep 1
          done
          echo "low-memory PHP target never became ready"
          docker logs php-lowmem
          exit 1

      - name: Scan the low-memory target
        run: >-
          python tests/real_php_check.py http://127.0.0.1:18091/index.php
          --body php2shell-ci --expect-signal

      - name: Show container logs
        if: failure()
        run: |
          docker logs php-patched || true
          docker logs php-lowmem || true

      - name: Stop the containers
        if: always()
        run: |
          docker rm --force php-patched || true
          docker rm --force php-lowmem || true
